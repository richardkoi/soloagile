# Serves each project's generated page, and nothing else, at /<project>/.
# /projects is your projects folder and /soloagile is ~/.soloagile, both mounted
# read-only (see docker-compose.yml).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /projects;

    # Only this machine's own addresses may be used as the Host: localhost, a private
    # network address, or a one-word machine name. This blocks DNS rebinding, where a
    # public website points its own domain at this address so the visitor's browser
    # reads the pages for it. Add your own names to the list if you use any others.
    set $host_ok 0;
    if ($host ~ "^(localhost|127\.0\.0\.1|192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|100\.\d{1,3}\.\d{1,3}\.\d{1,3}|[a-z0-9-]+)$") {
        set $host_ok 1;
    }
    if ($host_ok = 0) {
        return 403;
    }

    # / -> the home page listing every project's page, which soloagile writes to
    # ~/.soloagile/home.html.
    location = / {
        root /soloagile;
        add_header Cache-Control "no-cache";
        try_files /home.html =404;
    }

    # /<project>/ or /<project>/index.html -> <project>/pm/index.html. A name must
    # start with a letter or digit, so ".." and folders like _archived never match.
    location ~ "^/(?<project>[A-Za-z0-9][A-Za-z0-9._-]*)/(index\.html)?$" {
        add_header Cache-Control "no-cache";
        try_files /$project/pm/index.html =404;
    }

    location ~ "^/(?<project>[A-Za-z0-9][A-Za-z0-9._-]*)$" {
        return 308 /$project/;
    }

    location / {
        default_type text/plain;
        return 404 "Project pages live at /<project>/\n";
    }
}
