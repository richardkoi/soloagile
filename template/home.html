<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Projects - PM</title>
<!-- Generated by `soloagile home` (and by the rebuild hook) from every project's pm/*.md and
     template/flow.md. This file is overwritten. Shared styles and scripts: template/head.html,
     template/refresh.html. -->
{{> head}}
<style>
/* ---------- home: one row per project ---------- */
.proj-list { list-style: none; display: flex; flex-direction: column; gap: var(--space-md); max-width: var(--width-reading); }
.proj { display: block; background: var(--bg-surface); border: 1px solid var(--border-default); border-left: 4px solid var(--border-default);
  border-radius: var(--radius-lg); padding: var(--space-md) var(--space-lg); color: var(--text-secondary); }
.proj:hover { text-decoration: none; box-shadow: 0 0 0 1px var(--accent-link); }
/* The one coloured rail, as on the board: a project with something waiting on the user. */
.proj-waiting { border-left-color: var(--proj-4); background: color-mix(in srgb, var(--proj-4) 8%, var(--bg-surface)); }
.proj-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm) var(--space-md); }
.proj-name { font-size: var(--font-lg); font-weight: var(--weight-bold); color: var(--text-primary); margin-right: auto; overflow-wrap: anywhere; }
.proj-pills { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.proj-calm { font-size: var(--font-sm); color: var(--text-faint); }
.proj-ms, .proj-updated { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
.proj-ms { font-size: var(--font-base); }
.proj-ms b { color: var(--text-primary); }
.proj-ms .i { color: var(--accent-link); align-self: center; }
.proj-updated { font-size: var(--font-xs); color: var(--text-muted); }
.proj-updated .i { align-self: center; }
/* Health: the milestone in hand as a bar, in the burn-up's colours, and a dimmed row for a
   project where no card has moved for a week. */
.meter { position: relative; height: 10px; border-radius: 5px; background: var(--bg-overlay); overflow: hidden; margin-top: var(--space-sm); }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--s); }
.meter .s-approved { box-shadow: 2px 0 0 var(--bg-surface); }
.proj-points { font-size: var(--font-sm); color: var(--text-muted); margin-top: 6px; }
.proj-points b { color: var(--text-primary); }
.proj-quiet .proj-name, .proj-quiet .proj-ms, .proj-quiet .proj-ms b { color: var(--text-muted); }
@media (max-width: 700px) { .proj { padding: var(--space-sm) var(--space-md); } }
/* ---------- home: every waiting card, from every project, in one list ---------- */
.sec-h { display: flex; align-items: baseline; gap: var(--space-sm); font-size: var(--font-base); font-weight: var(--weight-bold);
  color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: var(--space-sm); }
.sec-h .lane-count { font-weight: var(--weight-regular); }
.wait-list { list-style: none; display: flex; flex-direction: column; gap: var(--space-sm); max-width: var(--width-reading); margin-bottom: var(--space-xl); }
.wait-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; color: var(--text-secondary); }
.wait-row:hover { text-decoration: none; background: color-mix(in srgb, var(--hue) 20%, var(--bg-surface)); }
.wait-row .card-id { margin-right: 0; }
.wait-proj { font-weight: var(--weight-semibold); color: var(--text-primary); }
.wait-title { flex: 1 1 260px; overflow-wrap: anywhere; }
/* ---------- home: two tabs, Projects (the default) and Session flow ---------- */
body:not(:has(.anchor:target)) .dk-nav a[href="#projects"],
body:has(#projects:target) .dk-nav a[href="#projects"],
body:has(#flow:target) .dk-nav a[href="#flow"] { background: var(--accent-link-bg); color: var(--accent-link); border-color: var(--accent-link); }
body:not(:has(.anchor:target)) .tab-projects,
body:has(#projects:target) .tab-projects,
body:has(#flow:target) .tab-flow { display: block; }
.tab-flow .panel-x { max-width: var(--width-reading); }
.tab-flow ol > li { margin-bottom: var(--space-sm); }
/* The wheel: six numbered tiles, Plan to Feedback, each with the bar a card at that stage shows.
   Three across on a desktop, one on a phone. */
.md-prose ol.wheel { list-style: none; margin: var(--space-md) 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-sm); counter-reset: stage; }
.md-prose ol.wheel > li { counter-increment: stage; margin: 0; display: flex; flex-direction: column; gap: 4px;
  background: var(--bg-inset); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: var(--space-md); }
.wheel b { font-size: var(--font-md); }
.wheel > li > b::before { content: counter(stage) ". "; color: var(--accent-link); }
.wheel-does { color: var(--text-secondary); line-height: 1.4; }
.wheel-say { color: var(--text-muted); font-size: var(--font-sm); line-height: 1.4; margin-top: auto; padding-top: 4px; }
@media (max-width: 760px) { .md-prose ol.wheel { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<span id="projects" class="anchor"></span><span id="flow" class="anchor"></span>
<a class="dk-skip" href="#main">Skip to content</a>
<header class="header">
  <div class="header-left">
    <div>
      <h1 class="header-title">Projects</h1>
      <p class="header-subtitle">{{summary}}</p>
    </div>
    <nav class="dk-nav" aria-label="Sections">
      {{nav}}
    </nav>
  </div>
  <div class="header-right">
    <span class="updated">{{built}}</span>
    {{> guide}}
    <button class="btn btn-ghost" type="button" onclick="toggleTheme()" aria-label="Switch between dark and light"><span class="theme-swatch"></span><span class="theme-name"></span></button>
  </div>
</header>
<main class="board-wrap" id="main">
  <section class="tab tab-projects" aria-label="Projects">
{{waiting}}
{{projects}}
  </section>
  <section class="tab tab-flow" aria-label="Session flow"><div class="panel-x md-prose">
{{flow}}
  </div></section>
</main>
{{> refresh}}
</body>
</html>
