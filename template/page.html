<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="generator" content="soloagile {{version}}">
<title>{{name}} - PM</title>
<!-- Generated by `soloagile build` from pm/*.md. Edit those files; this one is overwritten.
     Styling follows the "My Board" design system; text runs 2px above its sizes for readability. -->
{{> head}}
</head>
<body>
<span id="board" class="anchor"></span><span id="plan" class="anchor"></span><span id="reports" class="anchor"></span><span id="releases" class="anchor"></span><span id="docs" class="anchor"></span><span id="links" class="anchor"></span><span id="settings" class="anchor"></span>
<a class="dk-skip" href="#main">Skip to content</a>
<header class="header">
  <div class="header-left">
    <div>
      <h1 class="header-title">{{name}}</h1>
      <p class="header-subtitle">{{now}}</p>
    </div>
    <nav class="dk-nav" aria-label="Sections">
      {{nav}}
    </nav>
  </div>
  <div class="header-right">
    {{milestones}}
    <span class="updated">{{built}}</span>
    {{> guide}}
    <button class="btn btn-ghost" type="button" onclick="toggleTheme()" aria-label="Switch between dark and light"><span class="theme-swatch"></span><span class="theme-name"></span></button>
  </div>
</header>
<main class="board-wrap" id="main">
  <section class="tab tab-board" aria-label="Board">
    {{filter}}
    <div class="lanes">
{{board}}
    </div>
    {{key}}
  </section>
  <section class="tab tab-plan" aria-label="Plan"><div class="panel-x md-prose">
{{plan}}
  </div></section>
  <section class="tab tab-reports" aria-label="Reports"><div class="panel-x">
{{reports}}
  </div></section>
  <section class="tab tab-releases" aria-label="Releases"><div class="panel-x md-prose">
{{releases}}
  </div></section>
  <section class="tab tab-docs" aria-label="Docs"><div class="panel-x md-prose">
{{docs}}
  </div></section>
  <section class="tab tab-links" aria-label="Links"><div class="panel-x md-prose">
{{links}}
  </div></section>
  <section class="tab tab-settings" aria-label="Settings"><div class="panel-x">
{{settings}}
  </div></section>
</main>
{{> refresh}}
</body>
</html>
