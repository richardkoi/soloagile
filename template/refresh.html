<script>
/* How long each waiting card has waited, counted again as the page opens: the build wrote
   it too, but a quiet project's page may be days old. */
(function () {
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  document.querySelectorAll('[data-since]').forEach(function (el) {
    var p = el.getAttribute('data-since').split('-');
    var days = Math.round((today - new Date(p[0], p[1] - 1, p[2])) / 86400000);
    if (days >= 0) el.textContent = days ? 'waiting ' + days + (days === 1 ? ' day' : ' days') : 'since today';
  });
})();
/* The milestone filter: a chip shows only that milestone's cards, and each lane's count
   follows (a later look isn't counted, as on the build). The pick is remembered for this
   page, so it survives the live reload below; a milestone no longer on the board falls
   back to All. */
(function () {
  var bar = document.querySelector('.ms-filter');
  if (!bar) return;
  var key = 'soloagile-ms:' + location.pathname;
  var chips = bar.querySelectorAll('button');
  function show(ms) {
    var known = false;
    chips.forEach(function (b) { if (b.getAttribute('data-ms') === ms) known = true; });
    if (!known) ms = '';
    chips.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-ms') === ms)); });
    document.querySelectorAll('.lane').forEach(function (lane) {
      var body = lane.querySelector('.lane-body');
      if (!body) return;
      var count = 0, shown = 0;
      body.querySelectorAll(':scope > .card-x').forEach(function (li) {
        var on = !ms || li.getAttribute('data-ms') === ms;
        li.hidden = !on;
        if (on) { shown++; if (!li.hasAttribute('data-later')) count++; }
      });
      var n = lane.querySelector('.lane-count');
      if (n) n.textContent = count;
      var none = lane.querySelector('.ms-none');
      if (!shown && !none) {
        none = document.createElement('p');
        none.className = 'lane-empty ms-none';
        none.innerHTML = '&mdash;';
        body.after(none);
      }
      if (none) none.hidden = shown > 0;
      body.hidden = !shown;
    });
  }
  var saved = '';
  try { saved = localStorage.getItem(key) || ''; } catch (e) {}
  show(saved);
  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var ms = b.getAttribute('data-ms');
    try { localStorage.setItem(key, ms); } catch (e2) {}
    show(ms);
  });
})();
/* Ideas and Done fold to a thin strip and back (#134). Which are folded is remembered
   for this page, so a reload keeps them. */
(function () {
  var key = 'soloagile-fold:' + location.pathname;
  var folded = [];
  try { folded = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}
  document.querySelectorAll('.lane-fold').forEach(function (b) {
    var lane = b.closest('.lane');
    var name = lane.getAttribute('aria-label');
    function set(on) {
      lane.classList.toggle('folded', on);
      b.setAttribute('aria-expanded', String(!on));
      b.setAttribute('aria-label', (on ? 'Unfold ' : 'Fold ') + name + (on ? '' : ' to a strip'));
    }
    set(folded.indexOf(name) >= 0);
    b.addEventListener('click', function () {
      var on = !lane.classList.contains('folded');
      set(on);
      folded = folded.filter(function (n) { return n !== name; });
      if (on) folded.push(name);
      try { localStorage.setItem(key, JSON.stringify(folded)); } catch (e) {}
    });
  });
})();
/* The search box (#132). Words light the cards that hold them and dim the rest, across every
   lane. A card's number ("#12" or "12") and Enter opens that card: the milestone filter goes
   back to All first if it was hiding it, and a card with no pop-up is scrolled to instead. */
(function () {
  var box = document.querySelector('.card-find input');
  if (!box) return;
  var note = document.querySelector('.card-find-note');
  var cards = document.querySelectorAll('li.card-x');
  function light() {
    var q = box.value.trim().toLowerCase();
    var n = 0;
    cards.forEach(function (li) {
      var hit = q && li.textContent.toLowerCase().indexOf(q) >= 0;
      li.classList.toggle('find-hit', !!hit);
      li.classList.toggle('find-dim', !!q && !hit);
      if (hit && !li.hidden) n++;
    });
    note.textContent = !q ? '' : /^#?\d+$/.test(q) ? 'Enter opens card #' + q.replace('#', '') : n + (n === 1 ? ' card matches' : ' cards match');
  }
  box.addEventListener('input', light);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { box.value = ''; light(); return; }
    var m = box.value.trim().match(/^#?(\d+)$/);
    if (e.key !== 'Enter' || !m) return;
    var li = document.querySelector('li.card-x[data-id="' + m[1] + '"]');
    if (!li) { note.textContent = 'no card #' + m[1] + ' on this page'; return; }
    if (li.hidden) { var all = document.querySelector('.ms-filter button[data-ms=""]'); if (all) all.click(); }
    var modal = li.querySelector('.card-modal');
    if (modal) modal.showPopover(); else li.scrollIntoView({ block: 'center' });
  });
})();
/* Live refresh. Served over http: every 3 seconds, ask the server for this file's ETag and
   reload when it changes. Opened as a file, where no server can be asked: every 3 seconds,
   load the stamp the last build left, a one-line script saying when the page was built,
   and reload when that time is not this page's own. The open tab survives the reload
   because tabs are the URL's #hash. Checks pause while the browser tab is hidden. A reload
   would shut the card being read, so it waits until that card is closed. */
(function () {
  function reload() {
    if (document.querySelector('.card-modal:popover-open')) return;
    location.reload();
  }
  if (location.protocol === 'file:') {
    var stamp = "{{stampUrl}}", mine = "{{stamp}}";
    if (!stamp) return;
    window.__soloagileBuilt = function (at) { if (at !== mine) reload(); };
    function look() {
      if (document.hidden) return;
      var s = document.createElement('script');
      s.src = stamp + '?' + Date.now();
      s.onload = s.onerror = function () { s.remove(); };
      document.head.appendChild(s);
    }
    setInterval(look, 3000);
    document.addEventListener('visibilitychange', look);
    return;
  }
  if (!/^https?:$/.test(location.protocol)) return;
  var seen = null;
  function check() {
    fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      var tag = r.ok && (r.headers.get('ETag') || r.headers.get('Last-Modified'));
      if (!tag) return;
      // Remember the first tag only. A change found while a card is open is checked again
      // next time, so the reload happens once the card is closed.
      if (!seen) seen = tag;
      else if (tag !== seen) reload();
    }, function () {});
  }
  function checkIfShown() { if (!document.hidden) check(); }
  check();
  setInterval(checkIfShown, 3000);
  document.addEventListener('visibilitychange', checkIfShown);
})();
</script>
